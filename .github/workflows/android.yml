name: Android Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build split release APKs
        run: ./gradlew clean lint assembleRelease --stacktrace

      - name: Upload armeabi-v7a (armv7) release APK
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-release-armv7
          path: app/build/outputs/apk/release/*armeabi-v7a-release*.apk
          if-no-files-found: error

      - name: Upload arm64-v8a (arm64) release APK
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-release-arm64
          path: app/build/outputs/apk/release/*arm64-v8a-release*.apk
          if-no-files-found: error
