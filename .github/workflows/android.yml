name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check and build split APKs
        run: ./gradlew clean lint testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload minified release APKs
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
